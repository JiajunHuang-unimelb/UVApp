<svg viewBox="0 0 360 740" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect x="0" y="0" width="360" height="740" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- Toolbar -->
  <rect x="0" y="0" width="360" height="56" fill="#eeeeee" stroke="#333333" stroke-width="1"/>
  <text x="16" y="34" font-size="14" fill="#333333">&lt;</text>
  <text x="40" y="34" font-size="16" fill="#333333">Settings</text>

  <!-- Skin type -->
  <text x="16" y="92" font-size="14" fill="#333333">Skin type</text>
  <circle cx="24" cy="112" r="6" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="38" y="117" font-size="11" fill="#888888">[ Type I ]</text>
  <circle cx="24" cy="134" r="6" fill="#666666" stroke="#666666" stroke-width="1.5"/>
  <text x="38" y="139" font-size="11" fill="#888888">[ Type II - selected ]</text>
  <circle cx="24" cy="156" r="6" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="38" y="161" font-size="11" fill="#888888">[ ...Type III-VI ]</text>

  <!-- SPF -->
  <text x="16" y="200" font-size="14" fill="#333333">SPF</text>
  <text x="344" y="200" font-size="12" fill="#888888" text-anchor="end">[ No sunscreen ]</text>
  <line x1="20" y1="220" x2="340" y2="220" stroke="#999999" stroke-width="2"/>
  <circle cx="20" cy="220" r="7" fill="#666666"/>

  <!-- Notifications -->
  <text x="16" y="260" font-size="14" fill="#333333">Notifications</text>
  <rect x="300" y="248" width="44" height="24" rx="12" fill="none" stroke="#666666" stroke-width="1.5"/>
  <circle cx="334" cy="260" r="9" fill="#666666"/>

  <!-- Theme -->
  <text x="16" y="304" font-size="14" fill="#333333">Theme</text>
  <circle cx="24" cy="324" r="6" fill="#666666" stroke="#666666" stroke-width="1.5"/>
  <text x="38" y="329" font-size="11" fill="#888888">[ System default - selected ]</text>
  <circle cx="24" cy="346" r="6" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="38" y="351" font-size="11" fill="#888888">[ Light ]</text>
  <circle cx="24" cy="368" r="6" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="38" y="373" font-size="11" fill="#888888">[ Dark ]</text>

  <text x="180" y="710" font-size="10" fill="#bbbbbb" text-anchor="middle">Settings - low-fidelity wireframe (detailed)</text>
</svg>
